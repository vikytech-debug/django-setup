{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Index Page</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
    }
    nav {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav .brand {
      font-weight: 700;
      font-size: 1.25rem;
      color: #1e293b;
    }
    nav .links {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    nav a {
      text-decoration: none;
      color: #475569;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: #059669;
    }
    nav a.btn {
      background-color: #059669;
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
    }
    nav a.btn:hover {
      background-color: #047857;
    }
    main {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 0 1rem;
      text-align: center;
    }
    h1 {
      font-size: 2.25rem;
      margin-bottom: 1rem;
    }
    p.subtitle {
      color: #64748b;
      margin-bottom: 2.5rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background-color: #ffffff;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
    }
    .card img {
      width: 100%;
      height: 320px;
      object-fit: contain;
      background-color: #f1f5f9;
      display: block;
    }
    .card-body {
      padding: 1rem;
    }
  </style>
</head>
<body>

  <nav>
    <div class="brand">HTML Rendering</div>
    <div class="links">
      <a href="/about">About Page</a>
      <a href="{% url 'posts' %}">Posts</a>
      <a href="{% url 'create_user' %}" class="btn">Create Account</a>
    </div>
  </nav>

  <main>
    <h1>Welcome to My Application</h1>
    <p class="subtitle">A clean and responsive Django template showcase.</p>

    <div class="gallery">
      <div class="card">
        <img src="{% static 'image/Goat.jpg' %}" alt="Goat Image" />
        <div class="card-body">
          <h3>Featured Image 1</h3>
        </div>
      </div>
      <div class="card">
        <img src="{% static 'image/Goat.jpg' %}" alt="Goat Image" />
        <div class="card-body">
          <h3>Featured Image 2</h3>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
